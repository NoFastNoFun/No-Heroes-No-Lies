<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero cards (modal)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      #deck {
        display: flex;
        gap: 12px;
        padding: 24px;
        perspective: 1200px;
      }
      .card {
        position: relative;
        width: 160px;
        height: 240px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        transform-style: preserve-3d;
        border-radius: 6px;
        box-shadow: 0 4px 10px #0003;
      }
      .label {
        position: absolute;
        top: 4px;
        left: 4px;
        right: 4px;
        background: #000a;
        color: #fff;
        font-size: 14px;
        padding: 2px 4px;
        border-radius: 4px;
        text-align: center;
      }
      /* modal backdrop */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        z-index: 900;
      }
      /* info box */
      #info {
        position: fixed;
        max-width: 320px;
        max-height: 80vh;
        overflow: auto;
        background: #fff;
        border-radius: 10px;
        padding: 1em;
        box-shadow: 0 8px 20px #0006;
        z-index: 905;
      }
      #info h2 {
        margin: 0.25em 0 0.5em;
      }
      #info ul {
        margin: 0.25em 0 0.25em 1em;
        padding: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="deck"></div>
    <div id="overlay"></div>
    <div id="info"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
